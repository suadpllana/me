# One site: the shell at / and three hosted apps under /app/<name>/.
# `npm run build` runs scripts/build.mjs, which builds everything into dist/.

[build]
  command = "npm run build"
  publish = "dist"

# vite 8 needs node ^20.19 || >=22.12
[build.environment]
  NODE_VERSION = "22"

# Sync: the apps call /.netlify/functions/{ascend,vault}-sync, which relay to the
# original sites' sync functions (see netlify/functions).
[functions]
  directory = "netlify/functions"

# The app needs no rewrites: every tab has a real index.html and app routes live
# in the URL hash. These fallbacks only make path-style deep links such as
# /entertainment/movies work. (public/_redirects carries the same rules.)
[[redirects]]
  from = "/app/ascend/*"
  to = "/app/ascend/index.html"
  status = 200

[[redirects]]
  from = "/app/vault/*"
  to = "/app/vault/index.html"
  status = 200

[[redirects]]
  from = "/app/opinions/*"
  to = "/app/opinions/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change; cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
